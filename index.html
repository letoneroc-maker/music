<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超级简单音乐播放器</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 10px; font-size: 14px; }
    button { padding: 10px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    small { color: #666; }
    .section-title { margin: 18px 0 8px; font-weight: 700; }
    audio { width: 100%; margin-top: 18px; }
  </style>
</head>
<body>
  <h1>🎵 超级简单 Web 音乐播放器</h1>

  <div class="section-title">全球热门 5 首</div>
  <ul id="hot-list"></ul>

  <div class="section-title">搜索歌曲并直接播放</div>
  <div class="row">
    <input id="q" placeholder="输入歌曲名或歌手，例如: blinding lights" />
    <button id="search">搜索</button>
  </div>
  <ul id="result-list"></ul>

  <audio id="player" controls></audio>

  <script>
    // 只保留最简单逻辑：热门歌 + 搜索 + 点一下播放
    const hotSongs = [
      { name: 'Blinding Lights', artist: 'The Weeknd' },
      { name: 'Shape of You', artist: 'Ed Sheeran' },
      { name: 'As It Was', artist: 'Harry Styles' },
      { name: 'Flowers', artist: 'Miley Cyrus' },
      { name: 'Levitating', artist: 'Dua Lipa' }
    ];

    const hotList = document.getElementById('hot-list');
    const resultList = document.getElementById('result-list');
    const player = document.getElementById('player');
    const input = document.getElementById('q');

    function playSong(url) {
      player.src = url;
      player.play().catch(() => {});
    }

    function renderList(container, songs) {
      container.innerHTML = '';
      songs.forEach(song => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <div><strong>${song.trackName || song.name}</strong></div>
            <small>${song.artistName || song.artist}</small>
          </div>
          <button>播放</button>
        `;

        li.querySelector('button').onclick = () => {
          if (song.previewUrl) {
            playSong(song.previewUrl);
          } else {
            quickResolveAndPlay(song.name || song.trackName, song.artist || song.artistName);
          }
        };
        container.appendChild(li);
      });
    }

    async function quickResolveAndPlay(name, artist) {
      const term = encodeURIComponent(`${name} ${artist}`);
      const url = `https://itunes.apple.com/search?term=${term}&entity=song&limit=1`;
      const res = await fetch(url);
      const data = await res.json();
      const first = data.results && data.results[0];
      if (!first || !first.previewUrl) {
        alert('没找到可播放的音频预览');
        return;
      }
      playSong(first.previewUrl);
    }

    async function searchSongs() {
      const q = input.value.trim();
      if (!q) return;

      resultList.innerHTML = '<li>搜索中...</li>';
      const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=8`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          resultList.innerHTML = '<li>没有结果</li>';
          return;
        }
        renderList(resultList, data.results);
      } catch (e) {
        resultList.innerHTML = '<li>搜索失败，请稍后再试</li>';
      }
    }

    document.getElementById('search').onclick = searchSongs;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchSongs();
    });

    renderList(hotList, hotSongs);
  </script>
</body>
</html>
